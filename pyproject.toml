[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "druid-ai"
version = "0.1.2"
description = "AI-powered data science assistant — from raw data to trained models."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Leke", email = "lekewhite@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["ai", "machine-learning", "data-science", "eda", "automl", "llm"]

dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "feature-engine>=1.6.0",
    "missingno>=0.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.30.0"]
google = ["google-generativeai>=0.5.0"]
bigquery = ["google-cloud-bigquery>=3.10.0", "db-dtypes>=1.0.0"]
postgres = ["psycopg2-binary>=2.9.0", "sqlalchemy>=2.0.0"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "google-generativeai>=0.5.0",
    "google-cloud-bigquery>=3.10.0",
    "db-dtypes>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "xgboost>=1.7.0",
    "lightgbm>=4.0.0",
    "imbalanced-learn>=0.11.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/Lekewhite01/druid"
Documentation = "https://github.com/Lekewhite01/druid#readme"
Repository = "https://github.com/Lekewhite01/druid"
Issues = "https://github.com/Lekewhite01/druid/issues"

[tool.setuptools.packages.find]
include = ["druid*"]

[tool.setuptools.package-data]
druid = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
